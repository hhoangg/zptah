name: zptah Browser extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-extension-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension tests and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run ext:test
      - run: npm run ext:check
      - run: npm run ext:build
